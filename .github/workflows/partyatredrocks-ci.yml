name: Party at Red Rocks CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run DCC site manifest, ops auth, and owner summary tests
        run: npx tsx --import ./tests/server-only-shim.cjs --test tests/dcc-site.test.ts tests/ops-auth-and-owner-summary.test.ts

      - name: Run surface guard tests
        run: node --test tests/*.test.mjs
