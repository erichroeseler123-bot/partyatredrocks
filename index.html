<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Red Rocks Party Shuttle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<body>
  <div class="layout">

    <!-- DCC SIDEBAR -->
    <aside class="sidebar" id="dccSidebar">
      <h2>DCC · Red Rocks</h2>

      <div class="dcc-block">
        <strong>Status</strong>
        <p>Live event data</p>
      </div>

      <div class="dcc-block" id="dccPreview">
        <p>Hover a show to preview</p>
      </div>

      <hr />

      <a href="https://destinationcommandcenter.com" target="_blank">
        Open DCC →
      </a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">
      <h1>Red Rocks Party Shuttle</h1>
      <p>Ride together. Pre-game hard. Get home safe.</p>

      <h2>2026 Red Rocks Concert Calendar</h2>

      <div id="calendar" class="calendar-grid">
        <p>Loading events…</p>
      </div>
    </main>

  </div>

  <script src="/calendar.js"></script>
</body>

  <!-- Main styles -->
  <link rel="stylesheet" href="./styles.css" />
</head>

</html>
