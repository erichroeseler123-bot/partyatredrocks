<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Red Rocks 2026 Concert Calendar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- FullCalendar CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css"
    rel="stylesheet"
  >

  <!-- FullCalendar JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js">
  </script>

  <!-- Static concert data (MUST load before calendar script) -->
  <script src="/concerts.js"></script>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial,
                   sans-serif;
      padding: 20px;
      margin: 0;
      background: #fff;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    #calendar {
      max-width: 1100px;
      margin: 0 auto;
    }
  </style>
</head>
<body>

  <h1>Red Rocks 2026 Concert Calendar</h1>

  <div id="calendar"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      if (!Array.isArray(window.redRocks2026Events)) {
        console.error("Concert data not loaded");
        return;
      }

      const calendarEl = document.getElementById("calendar");

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: "dayGridMonth",
        initialDate: "2026-05-01",
        height: "auto",

        headerToolbar: {
          left: "prev,next today",
          center: "title",
          right: "dayGridMonth,timeGridWeek,listYear"
        },

        events: window.redRocks2026Events,

        eventClick: function (info) {
          info.jsEvent.preventDefault();
          if (info.event.url) {
            window.open(info.event.url, "_blank");
          }
        }
      });

      calendar.render();
    });
  </script>

</body>
</html>
