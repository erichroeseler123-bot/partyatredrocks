<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Red Rocks Party Shuttle</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <aside id="dcc-sidebar">
    <h2>DCC · Red Rocks</h2>
    <div class="status">LIVE EVENT DATA</div>

    <div id="dcc-preview">
      <div class="placeholder">
        Hover a show on the calendar to preview details
      </div>
    </div>

    <a class="dcc-link" href="#">
      Open Destination Command Center →
    </a>
  </aside>

  <main id="main">
    <h1>Red Rocks Party Shuttle</h1>
    <p class="tagline">Ride together. Pre-game hard. Get home safe.</p>

    <h2>2026 Red Rocks Concert Calendar</h2>

    <div class="calendar-header">
      <button id="prev-month">‹</button>
      <strong>May 2026</strong>
      <button id="next-month">›</button>
    </div>

    <div class="calendar-labels">
      <span>Sun</span><span>Mon</span><span>Tue</span>
      <span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
    </div>

    <div id="calendar" class="calendar-grid"></div>
  </main>

  <!-- All logic lives in calendar.js -->
  <script src="/calendar.js"></script>

</body>
</html>
