<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Show · Party At Red Rocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Absolute path required -->
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside id="dcc-sidebar">
    <h2>DCC · Red Rocks</h2>
    <div class="status">SHOW CONTEXT</div>

    <div id="dcc-preview">
      <div class="placeholder">Loading show…</div>
    </div>

    <a class="dcc-link" href="/">← Back to Calendar</a>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main">
    <h1 id="show-title">Loading…</h1>
    <p id="show-date" class="muted"></p>

    <section class="booking-card">
      <h3>Transportation</h3>
      <ul>
        <li>$59 Shuttle Seat</li>
        <li>$499 Suburban (private)</li>
      </ul>
      <a id="book-shuttle" href="#" class="cta">Book Shuttle</a>
    </section>

    <section class="tickets">
      <h3>Tickets</h3>
      <a
        id="ticketmaster-link"
        href="https://www.ticketmaster.com/red-rocks-amphitheatre-tickets-morrison/venue/246"
        target="_blank"
        rel="noopener"
      >
        Buy Tickets
      </a>
    </section>
  </main>

  <script>
    // SAME EVENT MAP AS calendar.js (temporary single source of truth)
    const EVENTS = {
      "2026-05-03": { artist: "Odesza", time: "6:30 PM" },
      "2026-05-07": { artist: "Zeds Dead", time: "7:00 PM" },
      "2026-05-15": { artist: "Kacey Musgraves", time: "6:00 PM" }
    };

    const params = new URLSearchParams(window.location.search);
    const date = params.get("date");

    if (!date || !EVENTS[date]) {
      document.getElementById("show-title").textContent =
        "Show not found";
      document.getElementById("dcc-preview").innerHTML =
        "<div class='placeholder'>Invalid or missing date</div>";
    } else {
      const ev = EVENTS[date];

      // Main content
      document.getElementById("show-title").textContent = ev.artist;
      document.getElementById("show-date").textContent =
        `${date} · ${ev.time}`;

      // Sidebar
      document.getElementById("dcc-preview").innerHTML = `
        <strong>${ev.artist}</strong><br />
        <span>${date} · ${ev.time}</span>
      `;

      // Shuttle link (future-proof)
      document.getElementById("book-shuttle").href =
        `/book.html?date=${encodeURIComponent(date)}`;
    }
  </script>

</body>
</html>
