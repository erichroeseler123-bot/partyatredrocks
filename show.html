<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Show Details – Red Rocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Concert data -->
  <script src="./concerts.js"></script>

  <!-- Spotify embed styling -->
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0b;
      color: #fff;
      margin: 0;
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .meta {
      opacity: 0.85;
      margin-bottom: 24px;
    }

    .cta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0;
    }

    .cta {
      padding: 14px 20px;
      background: #ff0055;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      border-radius: 6px;
      text-align: center;
      flex: 1 1 200px;
    }

    .cta.secondary {
      background: #222;
    }

    .cta.suburban {
      background: #0a4cff;
    }

    .section {
      margin-top: 36px;
    }

    iframe {
      border-radius: 12px;
      margin-top: 12px;
    }

    .back {
      display: inline-block;
      margin-top: 40px;
      opacity: 0.7;
      text-decoration: none;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1>Loading…</h1>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  if (!id || !window.redRocks2026Events) {
    document.getElementById("app").innerHTML = "<h1>Show not found</h1>";
  } else {
    const show = window.redRocks2026Events.find(e => e.id === id);

    if (!show) {
      document.getElementById("app").innerHTML = "<h1>Show not found</h1>";
    } else {
      const artistForSpotify = encodeURIComponent(show.title.split(" feat")[0]);

      document.getElementById("app").innerHTML = `
        <h1>${show.title}</h1>
        <div class="meta">
          📅 ${show.date}<br>
          📍 Red Rocks Amphitheatre – Morrison, CO
        </div>

        <div class="cta-row">
          <a class="cta" href="${show.ticketUrl}" target="_blank">
            🎟 Buy Tickets (AXS)
          </a>
          <a class="cta secondary" href="https://partyatredrocks.com">
            🚌 Book Party Shuttle
          </a>
          <a class="cta suburban" href="https://denverairportpickup.com">
            🚐 Book Suburban / Private Ride
          </a>
        </div>

        <div class="section">
          <h2>🎧 Listen</h2>
          <iframe
            src="https://open.spotify.com/embed/search/${artistForSpotify}"
            width="100%"
            height="352"
            frameborder="0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy">
          </iframe>
        </div>

        <a class="back" href="/">← Back to calendar</a>
      `;
    }
  }
</script>

</body>
</html>
