<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Show · Party At Red Rocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside id="dcc-sidebar">
    <h2>DCC · Red Rocks</h2>
    <div class="status">SHOW CONTEXT</div>

    <div id="dcc-preview">
      <div class="placeholder">Loading show…</div>
    </div>

    <a class="dcc-link" href="/">← Back to Calendar</a>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main">
    <h1 id="show-title">Loading…</h1>
    <p id="show-date" class="muted"></p>

    <section class="booking-card">
      <h3>Transportation</h3>
      <ul>
        <li>$59 Shuttle Seat</li>
        <li>$499 Suburban (private)</li>
      </ul>
      <a id="book-shuttle" href="#" class="cta">Book Shuttle</a>
    </section>

    <section class="tickets">
      <h3>Tickets</h3>
      <a
        id="ticketmaster-link"
        href="https://www.ticketmaster.com/red-rocks-amphitheatre-tickets-morrison/venue/246"
        target="_blank"
        rel="noopener"
      >
        Buy Tickets
      </a>
    </section>
  </main>

  <script>
    (async () => {
      const date = new URLSearchParams(location.search).get("date");
      if (!date) {
        document.getElementById("show-title").textContent = "No date specified";
        return;
      }

      const res = await fetch(
        "https://dcc-redrocks-2026.denverairportpickup.workers.dev/events/redrocks"
      );

      if (!res.ok) {
        document.getElementById("show-title").textContent =
          "Failed to load event data";
        return;
      }

      const data = await res.json();
      const ev = data.events.find(e => e.date === date);

      if (!ev) {
        document.getElementById("show-title").textContent = "Show not found";
        return;
      }

      const title = ev.artists.length
        ? ev.artists.join(", ")
        : ev.name;

      document.getElementById("show-title").textContent = title;
      document.getElementById("show-date").textContent =
        \`\${ev.date} · \${ev.time || ""}\`;

      document.getElementById("dcc-preview").innerHTML = \`
        <strong>\${title}</strong><br/>
        <span>\${ev.date} · \${ev.time || ""}</span>
      \`;

      document.getElementById("book-shuttle").href =
        \`/book.html?date=\${ev.date}\`;
    })();
  </script>

</body>
</html>
