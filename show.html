<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Show · Party At Red Rocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- LEFT SIDEBAR (DCC stays visible) -->
  <aside id="dcc-sidebar">
    <h2>DCC · Red Rocks</h2>
    <div class="status">SHOW CONTEXT</div>

    <div id="dcc-preview">
      <div class="placeholder">Loading show…</div>
    </div>

    <a class="dcc-link" href="/" >← Back to Calendar</a>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="main">
    <h1 id="show-title">Loading…</h1>
    <p id="show-date"></p>

    <section class="booking-card">
      <h3>Transportation</h3>
      <ul>
        <li>$59 Shuttle Seat</li>
        <li>$499 Suburban (private)</li>
      </ul>
      <a id="book-shuttle" href="#" class="cta">Book Shuttle</a>
    </section>

    <section class="tickets">
      <h3>Tickets</h3>
      <a id="ticketmaster-link" target="_blank">Buy Tickets</a>
    </section>
  </main>

  <script>
    (async function () {
      const params = new URLSearchParams(window.location.search);
      const eventId = params.get("eventId");
      if (!eventId) return;

      const res = await fetch(
        "https://dcc-redrocks-2026.denverairportpickup.workers.dev/api/dcc/redrocks"
      );
      const data = await res.json();
      const ev = (data.events || []).find(e => e.eventId === eventId);
      if (!ev) return;

      document.getElementById("show-title").textContent = ev.artist;
      document.getElementById("show-date").textContent = ev.date;

      document.getElementById("dcc-preview").innerHTML = `
        <strong>${ev.artist}</strong><br/>
        ${ev.date}<br/>
        Red Rocks Amphitheatre
      `;

      document.getElementById("ticketmaster-link").href = ev.ticketmaster || "#";
      document.getElementById("book-shuttle").href =
        "https://gosnotransportation58.rezdy.com";
    })();
  </script>

</body>
</html>
