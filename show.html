<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Show Details</title>
  <script src="./concerts.js"></script>
  <style>
    body { font-family: system-ui; max-width: 800px; margin: auto; padding: 24px; }
    .btn { display: inline-block; margin: 8px 8px 0 0; padding: 12px 16px; background: #000; color: #fff; text-decoration: none; }
  </style>
</head>
<body>

<div id="app">Loading…</div>

<script>
  const id = new URLSearchParams(location.search).get("id");
  const show = window.redRocks2026Events.find(s => s.id === id);

  if (!show) {
    document.getElementById("app").innerHTML =
      "<h1>Show not found</h1><p>ID mismatch between calendar and concerts.js</p>";
    throw new Error("Show not found");
  }

  document.getElementById("app").innerHTML = `
    <h1>${show.title}</h1>
    <p><strong>Date:</strong> ${show.date}</p>
    <p><strong>Venue:</strong> Red Rocks Amphitheatre</p>

    <a class="btn" href="${show.ticketUrl}" target="_blank">Buy Tickets (AXS)</a>
    <a class="btn" href="/book-shuttle.html?show=${show.id}">Book Shuttle</a>
    <a class="btn" href="/book-suburban.html?show=${show.id}">Book Suburban</a>
  `;
</script>

</body>
</html>
