<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Show Details – Red Rocks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Load concert data FIRST -->
  <script src="./concerts.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0d;
      color: #fff;
      padding-bottom: 90px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    a { color: #8ab4ff; text-decoration: none; }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
    }

    .meta {
      color: #b5b5b5;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    .pill {
      display: inline-block;
      background: #1e1e22;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      margin-right: 6px;
    }

    .description {
      margin: 18px 0 26px;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #e0e0e0;
    }

    .section-title {
      margin: 28px 0 12px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .spotify {
      margin-top: 12px;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      margin: 40px 0;
      font-size: 0.95rem;
    }

    /* Sticky CTA */
    .sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      gap: 10px;
      padding: 12px;
      background: rgba(0,0,0,0.95);
      backdrop-filter: blur(8px);
      z-index: 999;
    }

    .sticky-cta a {
      flex: 1;
      text-align: center;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .tickets {
      background: #ff0055;
      color: #fff;
    }

    .shuttle {
      background: #2563eb;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="container">

    <a href="/" style="opacity:.7">← Back to calendar</a>

    <h1 id="title"></h1>

    <div class="meta">
      <span id="date"></span> · Red Rocks Amphitheatre – Morrison, CO
    </div>

    <div>
      <span class="pill" id="genre"></span>
      <span class="pill">Doors: <span id="doors"></span></span>
      <span class="pill">Show: <span id="showTime"></span></span>
    </div>

    <div class="description" id="description"></div>

    <div class="section-title">Listen</div>
    <div class="spotify" id="spotify"></div>

    <div class="nav">
      <a id="prev"></a>
      <a id="next"></a>
    </div>

  </div>

  <!-- Sticky Money Bar -->
  <div class="sticky-cta">
    <a id="tickets" class="tickets" target="_blank">🎟 Buy Tickets (AXS)</a>
    <a id="shuttle" class="shuttle" target="_blank">🚍 Book Party Shuttle</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!window.redRocks2026Events || !id) {
      document.body.innerHTML = "<h1 style='padding:40px'>Show not found</h1>";
      throw new Error("Missing data or ID");
    }

    const events = window.redRocks2026Events;
    const index = events.findIndex(e => e.id === id);
    const event = events[index];

    if (!event) {
      document.body.innerHTML = "<h1 style='padding:40px'>Show not found</h1>";
      throw new Error("Invalid show ID");
    }

    // Populate content
    document.getElementById("title").textContent = event.title;
    document.getElementById("date").textContent =
      new Date(event.date).toLocaleDateString("en-US", {
        weekday: "long", month: "long", day: "numeric", year: "numeric"
      });

    document.getElementById("genre").textContent = event.genre;
    document.getElementById("doors").textContent = event.doors;
    document.getElementById("showTime").textContent = event.showTime;
    document.getElementById("description").textContent = event.description;

    document.getElementById("tickets").href = event.ticketUrl;

    document.getElementById("shuttle").href =
      `/shuttle.html?event=${event.id}`;

    // Spotify embed (ID ONLY — no search)
    if (event.spotifyArtistId) {
      document.getElementById("spotify").innerHTML = `
        <iframe
          src="https://open.spotify.com/embed/artist/${event.spotifyArtistId}"
          width="100%"
          height="352"
          style="border-radius:12px;border:none"
          allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
          loading="lazy">
        </iframe>
      `;
    } else {
      document.getElementById("spotify").innerHTML =
        "<p>No music preview available.</p>";
    }

    // Prev / Next navigation
    if (events[index - 1]) {
      document.getElementById("prev").href =
        `/show.html?id=${events[index - 1].id}`;
      document.getElementById("prev").textContent =
        "← " + events[index - 1].title;
    }

    if (events[index + 1]) {
      document.getElementById("next").href =
        `/show.html?id=${events[index + 1].id}`;
      document.getElementById("next").textContent =
        events[index + 1].title + " →";
    }
  </script>
</body>
</html>
