<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Show Details – Red Rocks</title>

  <!-- Concert data (SOURCE OF TRUTH) -->
  <script src="./concerts.js"></script>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0b0b0b;
      color: #fff;
      padding: 32px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 8px;
    }

    .meta {
      opacity: 0.8;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 18px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      display: inline-block;
    }

    .tickets { background: #ff0055; }
    .shuttle { background: #222; }
    .suburban { background: #0047ff; }

    iframe {
      width: 100%;
      height: 420px;
      border-radius: 14px;
      border: none;
    }

    .back {
      margin-top: 40px;
      display: inline-block;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="title"></h1>
    <div class="meta">
      <span id="date"></span> • Red Rocks Amphitheatre – Morrison, CO
    </div>

    <div class="buttons">
      <a id="ticket" class="btn tickets" target="_blank">Buy Tickets (AXS)</a>
      <a href="/shuttle.html" class="btn shuttle">Book Party Shuttle</a>
      <a href="/suburban.html" class="btn suburban">Book Suburban / Private Ride</a>
    </div>

    <h2>Listen</h2>
    <iframe
      id="spotify"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy">
    </iframe>

    <a href="/" class="back">← Back to calendar</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (!window.redRocks2026Events) {
      document.body.innerHTML = "<h1>Concert data not loaded</h1>";
      throw new Error("concerts.js missing");
    }

    const show = window.redRocks2026Events.find(e => e.id === id);

    if (!show) {
      document.body.innerHTML = "<h1>Show not found</h1>";
      throw new Error("Invalid show ID");
    }

    document.getElementById("title").textContent = show.title;
    document.getElementById("date").textContent = show.date;
    document.getElementById("ticket").href = show.ticketUrl;

    const primaryArtist = show.title
      .split(/ with | & |,| feat| featuring/i)[0]
      .trim();

    document.getElementById("spotify").src =
      "https://open.spotify.com/embed/search/" +
      encodeURIComponent(primaryArtist);
  </script>
</body>
</html>
